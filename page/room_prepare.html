<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/room_prepare.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="fixed-top">
        <div id="fixed-top-container">
            <p id="quest-title"></p>
            <p id="quest-code"></p>
        </div>
        <button id="edit-btn" class="owner-panel hidden"></button>
    </div>

    <div class="owner-panel hidden">
        <div class="title">
            <p >副本夥伴</p>
            <hr/>
        </div>
        <div id="owner-member-area">
        </div>
        <div class="title">
            <p >任務</p>
            <hr/>
        </div>
        <div id="task-area">
        </div>
    </div>

    <div class="member-panel hidden">
        <div class="title">
            <p >描述</p>
            <hr/>
        </div>
        <div id="desc-area">
            <p></p>
        </div>
        <div class="title">
            <p >副本夥伴</p>
            <hr/>
        </div>
        <div id="member-member-area">
        </div>
    </div>

    <div id="fixed-bottom">
        <button id="bottom-btn"></button>
    </div>


<!--     add-task-modal     -->

    <div id="add-task-modal" class="center-modal hidden">
        <div id="add-task-modal-content" class="center-modal-content">
            <div id="add-task-modal-edit-area">
                <input type="text" placeholder="副本名稱" id="task-name">
                <hr/>
                <div id="add-task-modal-type-area">
                    <p>類型</p>
                    <div id="btn-area">
                        <button id="main-task-btn" class="task-type">主線</button>
                        <button id="side-task-btn" class="task-type">支線</button>
                    </div>
                </div>
                <hr/>
                <div id="add-task-modal-reward-area">
                    <p>獎勵</p>
                    <p id="add-task-modal-reward-values">EXP</p>
                </div>
                <hr/>
                <p>任務描述</p>
                <textarea id="add-task-modal-task-desc"></textarea>
            </div>
            <button id="add-task-modal-add-btn" class="modal-block-radius-botton">新增任務</button>
            <p id="add-task-modal-add-task-hint" class="hidden">尚有欄位還未填寫</p>
        </div>
    </div>

    <script type="module" src="../js/room_prepare.js"></script>
</body>
