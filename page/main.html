<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="user-container">
        <div id="user-area">
            <img src="../assets/avatar.jpg" class="avatar">
            <div id="user-data">
                <p id="user-name"></p>
                <p id="user-level"></p>
            </div>
        </div>
        <button id="edit-btn"></button>
    </div>
    <div id="item-title">
        <p >你的旅行副本</p>
        <hr id="divider"/>
    </div>
    <div id="item-area">
    </div>


<!--     edit-modal     -->

    <div id="edit-modal" class="bottom-modal hidden">
        <div class="bottom-modal-content">
            <div class="modal-line-botton">
                <button class="create-btn">建立副本</button>
                <hr/>
            </div>
            <div class="modal-line-botton">
                <button class="join-btn">加入副本</button>
                <hr/>
            </div>
        </div>
    </div>


<!--     create-modal     -->
    
    <div id="create-modal" class="bottom-modal hidden">
        <div class="bottom-modal-content">
            <div class="modal-line-input">
                <input type="text" placeholder="副本名稱" class="quest-name">
                <hr/>
            </div>
            <div class="text-area">
                <p>副本開始日期</p>
                <input type="date" value="2007-08-21" class="quest-date">
            </div>
            <div class="text-area">
                <p>描述</p>
            </div>
            <textarea class="quest-desc"></textarea>
            <div>
                <button class="modal-block-botton create-btn">建立</button>
                <p class="hint hidden">尚有欄位還未填寫</p>
            </div>
        </div>
    </div>


<!--     join-modal     -->

    <div id="join-modal" class="bottom-modal hidden">
        <div class="bottom-modal-content">
            <div class="modal-line-input">
                <input type="text" placeholder="副本Code" class="quest-code">
                <hr/>
                <p class="hint"></p>
            </div>
            <button class="modal-block-botton join-btn">申請加入</button>
        </div>
    </div>
    
    <script type="module" src="../js/main.js"></script>
</body>
