<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/room_process.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="top-block">
        <p id="quest-title">副本名稱</p>
        <button id="owner-btn"></button>
    </div>

    <div id="second-block">
        <div id="ranking-area">
            <div class="area-title">
                <p>排行榜</p>
                <hr>
            </div>
            <div id="ranking-container">
                <div id="1st" class="ranking-item">
                    <img src="../assets/first-rank.png">
                    <div>
                        <p>小明</p>
                        <p>820 EXP</p>
                    </div>
                </div>
                <div id="2nd" class="ranking-item">
                    <img src="../assets/second-rank.png">
                    <div>
                        <p>小美</p>
                        <p>510 EXP</p>
                    </div>
                </div>
                <div id="3rd" class="ranking-item">
                    <img src="../assets/third-rank.png">
                    <div>
                        <p>小帥</p>
                        <p>270 EXP</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="total-area">
            <div class="area-title">
                <p>大家一起完成了...</p>
                <hr>
            </div>
            <div id="total-container">
                <div>
                    <p id="total-value">20</p>
                    <p id="total-text">件任務</p>
                </div>
            </div>
        </div>
    </div>

    <div id="task-area">
        <div class="area-title">
            <p>任務池</p>
            <hr>
        </div>
        <div id="task-container">
        </div>
    </div>

    <div id="todo-area">
        <div class="area-title">
            <p>你的任務清單</p>
            <hr>
        </div>
        <div id="todo-container">
        </div>
    </div>

    <div id="reward-area">
        <div class="area-title">
            <p>已獲得獎勵</p>
            <hr>
        </div>
        <div id="reward-container">
            <P id="reward-value">EXP +10</P>
        </div>
    </div>


    <div id="owner-modal" class="modal hidden">
        <div id="owner-modal-content">
            <div class="text-area">
                <button id="add-task">新增任務</button>
                <hr/>
            </div>
            <div class="text-area">
                <button id="check-member-task">夥伴任務提交認證</button>
                <hr/>
            </div>
            <div class="text-area">
                <button id="finish-quest">結束副本</button>
                <hr/>
            </div>
        </div>
    </div>


    <div id="task-modal" class="center-modal hidden">
        <div id="task-modal-content">
            <div id="task-modal-top-block">
                <p id="task-modal-name">任務名稱</p>
                <p id="task-modal-type">類型</p>
            </div>
            <div id="task-modal-desc-block">
                <p>任務描述</p>
                <hr/>
                <p>描述內容</p>
            </div>
            <div id="task-modal-reward-block">
                <p>獎勵</p>
                <hr/>
                <p id="task-modal-exp">10 EXP</p>
            </div>
            <button class="task-modal-btn">接任務</button>
        </div>
    </div>

    <script type="module" src="../js/room_process.js"></script>
</body>
