<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/room_process.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="top-block">
        <p id="quest-title"></p>
        <button id="owner-btn"></button>
    </div>

    <div id="second-block">
        <div id="ranking-area">
            <div class="area-title">
                <p>排行榜</p>
                <hr>
            </div>
            <div id="ranking-container">
                <div id="1st" class="ranking-item">
                    <img src="../assets/first-rank.png">
                    <div>
                        <p>小明</p>
                        <p>820 EXP</p>
                    </div>
                </div>
                <div id="2nd" class="ranking-item">
                    <img src="../assets/second-rank.png">
                    <div>
                        <p>小美</p>
                        <p>510 EXP</p>
                    </div>
                </div>
                <div id="3rd" class="ranking-item">
                    <img src="../assets/third-rank.png">
                    <div>
                        <p>小帥</p>
                        <p>270 EXP</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="total-area">
            <div class="area-title">
                <p>大家一起完成了...</p>
                <hr>
            </div>
            <div id="total-container">
                <div>
                    <p id="total-value"></p>
                    <p id="total-text">件任務</p>
                </div>
            </div>
        </div>
    </div>

    <div id="task-area">
        <div class="area-title">
            <p>任務池</p>
            <hr>
        </div>
        <div id="task-container">
        </div>
    </div>

    <div id="todo-area">
        <div class="area-title">
            <p>你的任務清單</p>
            <hr>
        </div>
        <div id="todo-container">
        </div>
    </div>

    <div id="reward-area">
        <div class="area-title">
            <p>已獲得獎勵</p>
            <hr>
        </div>
        <div id="reward-container">
            <P id="reward-value">EXP +10</P>
        </div>
    </div>


<!--     owner-modal     -->

    <div id="owner-modal" class="modal hidden">
        <div id="owner-modal-content">
            <div class="text-area">
                <button id="add-task">新增任務</button>
                <hr/>
            </div>
            <div class="text-area">
                <button id="check-member-task">夥伴任務提交認證</button>
                <hr/>
            </div>
            <div class="text-area">
                <button id="finish-quest">結束副本</button>
                <hr/>
            </div>
        </div>
    </div>


<!--     task-modal     -->

    <div id="task-modal" class="center-modal hidden">
        <div id="task-modal-content">
            <div id="task-modal-top-block">
                <p id="task-modal-name">任務名稱</p>
                <p id="task-modal-type">類型</p>
            </div>
            <div id="task-modal-desc-block">
                <p>任務描述</p>
                <hr/>
                <p>描述內容</p>
            </div>
            <div id="task-modal-reward-block">
                <p>獎勵</p>
                <hr/>
                <p id="task-modal-exp">10 EXP</p>
            </div>
            <button class="task-modal-btn">接任務</button>
        </div>
    </div>


<!--     todo-modal     -->

    <div id="todo-modal" class="center-modal hidden">
        <div id="todo-modal-content">
            <div id="todo-modal-top-block">
                <p id="todo-modal-name">任務名稱</p>
                <p id="todo-modal-type">類型</p>
            </div>
            <div id="todo-modal-desc-block">
                <p>任務描述</p>
                <hr/>
                <p id="todo-modal-desc">描述內容</p>
            </div>
            <div id="todo-modal-update-block">
                <p>上傳圖片</p>
                <label id="image-box" for="proof-image-input">
                    <img id="preview-image">
                    <span id="upload-text">
                        +
                    </span>
                </label>
                <input type="file" id="proof-image-input" accept="image/*" hidden>
            </div>
            <button id="todo-modal-btn">提交</button>
        </div>
    </div>


<!--     add-task-modal     -->

    <div id="add-task-modal" class="center-modal hidden">
        <div id="add-task-modal-content">
            <div id="add-task-modal-edit-area">
                <input type="text" placeholder="副本名稱" id="task-name">
                <hr/>
                <div id="add-task-modal-type-area">
                    <p>類型</p>
                    <div id="btn-area">
                        <button id="main-task-btn">主線</button>
                        <button id="side-task-btn">支線</button>
                    </div>
                </div>
                <hr/>
                <div id="add-task-modal-reward-area">
                    <p>獎勵</p>
                    <p id="add-task-modal-reward-values">EXP</p>
                </div>
                <hr/>
                <p>任務描述</p>
                <textarea id="add-task-modal-task-desc"></textarea>
            </div>
            <button id="add-task-modal-add-btn">新增任務</button>
            <p id="add-task-modal-add-task-hint" class="hidden">尚有欄位還未填寫</p>
        </div>
    </div>

    <script type="module" src="../js/room_process.js"></script>
</body>
