<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/room_process.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="top-block">
        <p id="quest-title">副本名稱</p>
        <button id="owner-btn"></button>
    </div>

    <div id="second-block">
        <div id="ranking-area">
            <div class="area-title">
                <p>排行榜</p>
                <hr>
            </div>
            <div id="ranking-container">
                <div id="1st" class="ranking-item">
                    <img src="../assets/first-rank.png">
                    <div>
                        <p>小明</p>
                        <p>820 EXP</p>
                    </div>
                </div>
                <div id="2nd" class="ranking-item">
                    <img src="../assets/second-rank.png">
                    <div>
                        <p>小美</p>
                        <p>510 EXP</p>
                    </div>
                </div>
                <div id="3rd" class="ranking-item">
                    <img src="../assets/third-rank.png">
                    <div>
                        <p>小帥</p>
                        <p>270 EXP</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="total-area">
            <div class="area-title">
                <p>大家一起完成了...</p>
                <hr>
            </div>
            <div id="total-container">
                <div>
                    <p id="total-value">20</p>
                    <p id="total-text">件任務</p>
                </div>
            </div>
        </div>
    </div>

    <div id="task-area">
        <div class="area-title">
            <p>任務池</p>
            <hr>
        </div>
        <div id="task-container">
            <div class="task-item">
                <div class="task-item-text">
                    <p class="task-item-name">任務名稱</p>
                    <p class="task-item-type">類型</p>
                </div>
                <hr>
            </div>
            <div class="task-item">
                <div class="task-item-text">
                    <p class="task-item-name">任務名稱</p>
                    <p class="task-item-type">類型</p>
                </div>
                <hr>
            </div>
        </div>
    </div>

    <div id="todo-area">
        <div class="area-title">
            <p>你的任務清單</p>
            <hr>
        </div>
        <div id="todo-container">
            <div class="todo-item">
                <div class="todo-item-text">
                    <p  class="todo-item-name">任務名稱</p>
                    <p class="todo-item-state">任務狀態</p>
                </div>
                <hr>
            </div>
            <div class="todo-item">
                <div class="todo-item-text">
                    <p  class="todo-item-name">任務名稱</p>
                    <p class="todo-item-state">任務狀態</p>
                </div>
                <hr>
            </div>
        </div>
    </div>

    <div id="reward-area">
        <div class="area-title">
            <p>已獲得獎勵</p>
            <hr>
        </div>
        <div id="reward-container">
            <P id="reward-value">EXP +10</P>
        </div>
    </div>
</body>
