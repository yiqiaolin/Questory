<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/room_process.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="top-block">
        <p id="quest-title"></p>
        <button id="owner-btn"></button>
    </div>

    <div id="second-block">
        <div id="ranking-area">
            <div class="area-title">
                <p>排行榜</p>
                <hr>
            </div>
            <div id="ranking-container">
                <div id="1st" class="ranking-item">
                    <img src="../assets/first-rank.png">
                    <div>
                        <p>小明</p>
                        <p>820 EXP</p>
                    </div>
                </div>
                <div id="2nd" class="ranking-item">
                    <img src="../assets/second-rank.png">
                    <div>
                        <p>小美</p>
                        <p>510 EXP</p>
                    </div>
                </div>
                <div id="3rd" class="ranking-item">
                    <img src="../assets/third-rank.png">
                    <div>
                        <p>小帥</p>
                        <p>270 EXP</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="total-area">
            <div class="area-title">
                <p>大家一起完成了...</p>
                <hr>
            </div>
            <div id="total-container">
                <div>
                    <p id="total-value"></p>
                    <p id="total-text">件任務</p>
                </div>
            </div>
        </div>
    </div>

    <div id="task-area">
        <div class="area-title">
            <p>任務池</p>
            <hr>
        </div>
        <div id="task-container">
        </div>
    </div>

    <div id="todo-area">
        <div class="area-title">
            <p>你的任務清單</p>
            <hr>
        </div>
        <div id="todo-container">
        </div>
    </div>

    <div id="reward-area">
        <div class="area-title">
            <p>已獲得獎勵</p>
            <hr>
        </div>
        <div id="reward-container">
            <p id="reward-value">EXP +10</p>
        </div>
    </div>


<!--     owner-modal     -->

    <div id="owner-modal" class="bottom-modal hidden">
        <div class="bottom-modal-content">
            <div class="modal-line-botton">
                <button class="add-task-btn">新增任務</button>
                <hr/>
            </div>
            <div class="modal-line-botton">
                <button class="verify-task-btn">夥伴任務提交認證</button>
                <hr/>
            </div>
            <div class="modal-line-botton">
                <button class="finish-btn">結束副本</button>
                <hr/>
            </div>
        </div>
    </div>


<!--     task-modal     -->

    <div id="task-modal" class="center-modal hidden">
        <div class="center-modal-content">
            <div class="top-block">
                <p class="task-name">任務名稱</p>
                <p class="task-type">類型</p>
            </div>
            <div class="desc-block">
                <p>任務描述</p>
                <hr/>
                <p class="task-desc">描述內容</p>
            </div>
            <div class="reward-block">
                <p>獎勵</p>
                <hr/>
                <p class="task-exp">10 EXP</p>
            </div>
            <button class="modal-block-radius-botton accept-btn">接任務</button>
        </div>
    </div>


<!--     todo-modal     -->

    <div id="todo-modal" class="center-modal hidden">
        <div class="center-modal-content">
            <div class="top-block">
                <p class="task-name">任務名稱</p>
                <p class="task-type">類型</p>
            </div>
            <div class="desc-block">
                <p>任務描述</p>
                <hr/>
                <p class="task-desc">描述內容</p>
            </div>

            <div class="in_progress-panel">
                <div class="update-block">
                    <p>上傳圖片</p>
                    <label class="image-box" for="proof-image-input">
                        <img class="preview-image">
                        <span class="upload-text">
                            +
                        </span>
                    </label>
                    <input type="file" id="proof-image-input" accept="image/*" hidden>
                </div>
                <button class="modal-block-radius-botton submit-btn">提交</button>
            </div>

            <div class="submitted-panel">
                <div class="image-block">
                    <p>認證圖片</p>
                    <div class="image-box">
                        <img class="proof-image">
                    </div>
                </div>
                <p class="text">等待隊長認證中......</p>
            </div>

            <div class="completed-panel">
                <div class="image-block">
                    <p>認證圖片</p>
                    <div class="image-box">
                        <img class="proof-image">
                    </div>
                </div>
                <div class="reward-block">
                    <p>獎勵</p>
                    <hr/>
                    <p class="reward-value">EXP</p>
                </div>
            </div>

            <div class="failed-panel">
                <div class="image-block">
                    <p>認證圖片</p>
                    <div class="image-box">
                        <img class="proof-image">
                    </div>
                </div>
                <button class="modal-block-radius-botton resubmit-btn">重新提交</button>
            </div>
        </div>
    </div>


<!--     add-task-modal     -->

    <div id="add-task-modal" class="center-modal hidden">
        <div class="center-modal-content">
            <div class="edit-area">
                <input type="text" placeholder="副本名稱" class="task-name">
                <hr/>
                <div class="type-area">
                    <p>類型</p>
                    <div class="btn-area">
                        <button class="task-type main-task-btn">主線</button>
                        <button class="task-type side-task-btn">支線</button>
                    </div>
                </div>
                <hr/>
                <div class="reward-area">
                    <p>獎勵</p>
                    <p class="reward-values">EXP</p>
                </div>
                <hr/>
                <p>任務描述</p>
                <textarea class="task-desc"></textarea>
            </div>
            <button class="modal-block-radius-botton add-btn">新增任務</button>
            <p class="hidden hint">尚有欄位還未填寫</p>
        </div>
    </div>



<!--     verify-task-modal     -->

    <div id="verify-task-modal" class="center-modal hidden">
        <div class="center-modal-content">
            <div class="top-block">
                <p>待認證任務</p>
                <hr/>
            </div>
            <div class="items-area hide-scrollbar">
            </div>
        </div>
    </div>


<!--     verify-task-item-modal     -->

    <div id="verify-task-item-modal" class="center-modal hidden">
        <div class="center-modal-content">
            <div class="top-block">
                <p class="user-name">成員名稱</p>
            </div>
            <div class="desc-block">
                <p class="task-name">任務名稱</p>
                <hr/>
                <p class="task-desc">描述內容</p>
            </div>
            <div class="image-block">
                <p>認證圖片</p>
                <div class="image-box">
                    <img class="proof-image">
                </div>
            </div>
            <div class="btn-block">
                <button class="modal-block-radius-botton verify-btn">認證</button>
                <button class="modal-block-radius-botton refuse-btn">拒絕</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/room_process.js"></script>
</body>
